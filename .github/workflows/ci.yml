name: CI

on:
  push:
    branches: [main, develop, version-15, version-16]
  pull_request:

concurrency:
  group: ci-frappe_microsoft365-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Frappe ${{ matrix.frappe-branch }} (install + migrate + tests)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe-branch: version-15
            python-version: "3.10"
            node-version: "18"
          # Frappe version-16 pins requires-python >=3.14,<3.15 and node >=24.
          - frappe-branch: version-16
            python-version: "3.14"
            node-version: "24"

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --host=localhost --password=root"
          --health-interval=5s --health-timeout=2s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client redis-tools libcups2-dev

      - name: Install frappe-bench
        run: pip install frappe-bench

      - name: Init bench + Frappe
        run: |
          bench init --skip-redis-config-generation --skip-assets \
            --frappe-branch ${{ matrix.frappe-branch }} --python "$(which python)" ~/frappe-bench

      - name: Point bench at the CI services
        working-directory: /home/runner/frappe-bench
        run: |
          bench set-config -g redis_cache    redis://localhost:6379
          bench set-config -g redis_queue    redis://localhost:6379
          bench set-config -g redis_socketio redis://localhost:6379
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Get app + create site + install + migrate
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          bench get-app frappe_microsoft365 "${GITHUB_WORKSPACE}"
          bench new-site test_site \
            --mariadb-root-password root --admin-password admin \
            --db-host 127.0.0.1 --db-port 3306 --mariadb-user-host-login-scope='%'
          bench --site test_site install-app frappe_microsoft365
          bench --site test_site migrate

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app frappe_microsoft365
